<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veja o histórico dos seus pedidos">
  <title>Meus Pedidos | Pedidos Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">🛍️ Pedidos Online</a>
    <ul class="navbar-links">
      <li><a href="/">Catálogo</a></li>
      <li><a href="/cart.html">Carrinho <span class="cart-badge" id="cart-count">0</span></a></li>
    </ul>
  </nav>

  <!-- Conteúdo -->
  <main class="container">
    <h1 class="page-title">📦 Meus Pedidos</h1>

    <div id="alert-container"></div>

    <div id="loading-orders" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Carregando seus pedidos...</p>
    </div>

    <div id="orders-list">
      <!-- Pedidos carregados via JS -->
    </div>

    <div class="empty-state" id="empty-orders" style="display:none;">
      <p style="font-size:2rem; margin-bottom:8px;">📭</p>
      <p>Você ainda não fez nenhum pedido.</p>
      <a href="/" class="btn btn-primary" style="margin-top:16px;">Ver Produtos</a>
    </div>
  </main>

  <script src="/js/cart-utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/meus-pedidos.js"></script>
</body>
</html>
