<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login administrativo">
  <title>Login Admin | Pedidos Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">🛍️ Pedidos Online</a>
    <ul class="navbar-links">
      <li><a href="/">Catálogo</a></li>
      <li><a href="/cart.html">Carrinho <span class="cart-badge" id="cart-count">0</span></a></li>
    </ul>
  </nav>

  <!-- Login -->
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="login-header">
        <h1>🔒 Área Administrativa</h1>
        <p>Faça login com conta de administrador.</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="admin@admin.com" required>
        </div>
        <div class="form-group">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Entrar como Admin</button>
      </form>

      <div class="login-footer">
        <a href="/login.html">← Voltar para login de usuário</a>
      </div>
    </div>
  </div>

  <script src="/js/cart-utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Se já é admin logado, redireciona
    if (Auth.isLoggedIn() && Auth.isAdmin()) {
      window.location.href = '/admin.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const data = await Auth.login(email, senha);

        if (data.usuario.role !== 'admin') {
          Auth.clear();
          throw new Error('Esta conta não possui permissão de administrador.');
        }

        window.location.href = '/admin.html';
      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar como Admin';
      }
    });
  </script>
</body>
</html>
