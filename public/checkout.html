<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Finalizar pedido - Insira seus dados para concluir">
  <title>Checkout | Pedidos Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">🛍️ Pedidos Online</a>
    <ul class="navbar-links">
      <li><a href="/">Catálogo</a></li>
      <li><a href="/cart.html">Carrinho <span class="cart-badge" id="cart-count">0</span></a></li>
      <li><a href="/admin-login.html">Admin</a></li>
    </ul>
  </nav>

  <!-- Conteúdo -->
  <main class="container">
    <h1 class="page-title">Finalizar Pedido</h1>

    <div id="alert-container"></div>

    <div class="layout-two-col">
      <!-- Formulário -->
      <div class="card">
        <h2 style="font-size:1.1rem; margin-bottom:20px;">Dados para entrega</h2>
        <form id="checkout-form">
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label for="endereco">Endereço de entrega</label>
            <textarea id="endereco" class="form-control" placeholder="Rua, número, bairro, cidade - CEP" required></textarea>
          </div>
          <button type="submit" class="btn btn-success btn-block" id="btn-submit">
            Confirmar Pedido
          </button>
        </form>
      </div>

      <!-- Resumo do pedido -->
      <div class="card">
        <h2 style="font-size:1.1rem; margin-bottom:20px;">Resumo do pedido</h2>
        <div id="order-summary">
          <!-- Itens listados via JS -->
        </div>
        <div class="cart-summary">
          <span class="total">Total: <strong id="order-total">R$ 0,00</strong></span>
        </div>
      </div>
    </div>

    <!-- Pedido confirmado -->
    <div class="card" id="order-success" style="display:none; text-align:center; padding:48px;">
      <h2 style="color:var(--success); margin-bottom:12px;">✅ Pedido Confirmado!</h2>
      <p style="margin-bottom:8px;">Seu pedido <strong id="order-id"></strong> foi registrado com sucesso.</p>
      <p style="color:var(--gray-500); margin-bottom:24px;">Obrigado pela sua compra!</p>
      <a href="/" class="btn btn-primary">Voltar ao catálogo</a>
    </div>
  </main>

  <script src="/js/cart-utils.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
