<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrinho de compras - Revise seus itens">
  <title>Carrinho | Pedidos Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">🛍️ Pedidos Online</a>
    <ul class="navbar-links">
      <li><a href="/">Catálogo</a></li>
      <li><a href="/cart.html" class="active">Carrinho <span class="cart-badge" id="cart-count">0</span></a></li>
      <li><a href="/admin.html">Admin</a></li>
    </ul>
  </nav>

  <!-- Conteúdo -->
  <main class="container">
    <h1 class="page-title">Carrinho de Compras</h1>

    <div id="alert-container"></div>

    <!-- Lista de itens -->
    <div class="card" id="cart-container">
      <div id="cart-items">
        <!-- Itens do carrinho carregados via JS -->
      </div>

      <div class="cart-summary" id="cart-summary" style="display:none;">
        <span class="total">Total: <strong id="cart-total">R$ 0,00</strong></span>
        <a href="/checkout.html" class="btn btn-success">Finalizar Pedido</a>
      </div>
    </div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <p>Seu carrinho está vazio.</p>
      <a href="/" class="btn btn-primary">Ver Produtos</a>
    </div>
  </main>

  <script src="/js/cart-utils.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
